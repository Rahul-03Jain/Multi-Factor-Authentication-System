<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Verification | MFA Auth</title>

  <meta name="theme-color" content="#eef1f6">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="auth-container">

    <div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>

    <h2 id="pageTitle">Verify Your Email</h2>

    <p class="subtitle" id="pageSubtitle">
      Enter the 6-digit code sent to your email.
    </p>

    <div
      id="message"
      class="message"
      role="alert">
    </div>

    <form id="emailOtpForm" novalidate>

      <label for="otpCode">
        Verification Code
      </label>

      <input
        type="text"
        id="otpCode"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="Enter 6-digit code"
        required
      >

      <div class="button-group">

        <button
          type="submit"
          class="btn-login"
          id="verifyOtpBtn">
          Verify Email
        </button>

      </div>

    </form>

    <div class="secondary-links">

      <button
        type="button"
        id="resendOtpBtn"
        class="link-button">
        Resend code
      </button>

      <a href="/login.html">
        Back to login
      </a>

    </div>

  </div>

  <script src="/app.js"></script>

  <script>
    App.initEmailOtpPage();
  </script>

</body>
</html>
