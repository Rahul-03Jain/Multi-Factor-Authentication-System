<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticator Verification | MFA Auth</title>
  <meta name="theme-color" content="#eef1f6">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h2>Two-Factor Verification</h2>
    <p class="subtitle">Open Google Authenticator and enter the current 6-digit code.</p>

    <div id="message" class="message" role="alert"></div>

    <div class="totp-display">
      <span id="totpCountdown">30</span>s
    </div>

    <form id="mfaForm" novalidate>
      <label for="otp">Authenticator code</label>
      <input type="text" id="otp" class="otp-input" placeholder="000000"
             inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>

      <div class="button-group">
        <button type="submit" class="btn-login" id="verifyBtn">Verify & Continue</button>
        <a href="/login.html" class="btn btn-link">Back to login</a>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
  <script>App.initMfaPage();</script>
</body>
</html>
