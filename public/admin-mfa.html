<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Administrator MFA | MFA Auth</title>

  <meta name="theme-color" content="#eef1f6">
  <script src="/theme.js"></script>
  <link
    rel="stylesheet"
    href="/style.css">
</head>

<body>

  <div class="auth-container">

    <div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>

    <h2>Administrator MFA</h2>

    <p class="subtitle">
      Enter the 6-digit code from Google Authenticator.
    </p>

    <div
      id="message"
      class="message"
      role="alert">
    </div>

    <form
      id="adminMfaForm"
      novalidate>

      <label for="adminMfaCode">
        Authenticator Code
      </label>

      <input
        type="text"
        id="adminMfaCode"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="Enter 6-digit code"
        required
      >

      <div class="button-group">

        <button
          type="submit"
          class="btn-login"
          id="adminMfaBtn">
          Verify & Continue
        </button>

      </div>

    </form>

    <div class="secondary-links">

      <a href="/admin-login.html">
        Back to administrator login
      </a>

    </div>

  </div>

  <script src="/app.js"></script>

  <script>
    App.initAdminMfaPage();
  </script>

</body>
</html>
