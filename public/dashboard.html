<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | MFA Auth</title>
  <meta name="theme-color" content="#eef1f6">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></div>
    <h1>Dashboard</h1>
    <p class="subtitle" id="welcomeMsg">Loading...</p>

    <div id="message" class="message" role="alert"></div>

    <div class="user-card">
      <p><strong>Name:</strong> <span id="userName">—</span></p>
      <p><strong>Email:</strong> <span id="userEmail">—</span></p>
      <p><strong>MFA:</strong> <span class="status active">Google Authenticator enabled</span></p>
    </div>

    <div class="button-group">
      <button type="button" class="btn-danger" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>App.initDashboardPage();</script>
</body>
</html>
