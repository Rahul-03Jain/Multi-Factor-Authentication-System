<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | MFA Auth</title>
  <meta name="theme-color" content="#eef1f6">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg></div>
    <h2>Reset Password</h2>
    <p class="subtitle">Choose a new password for your account.</p>

    <div id="message" class="message" role="alert"></div>

    <form id="resetForm" novalidate>
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="Minimum 8 characters" autocomplete="new-password" required>

      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password" required>

      <div class="button-group">
        <button type="submit" class="btn-login" id="resetBtn">Reset Password</button>
      </div>
    </form>
  </div>

  <script src="/ui.js"></script>
  <script src="/app.js"></script>
  <script>App.initResetPage();</script>
</body>
</html>
