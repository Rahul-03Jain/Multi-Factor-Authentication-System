<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | MFA Auth</title>
  <meta name="theme-color" content="#eef1f6">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
    <h2>Forgot Password</h2>
    <p class="subtitle" id="forgotSubtitle">Enter your email and we'll send a reset link.</p>

    <div id="message" class="message" role="alert"></div>

    <form id="forgotForm" novalidate>
      <label for="forgotEmail">Email</label>
      <input type="email" id="forgotEmail" placeholder="Email ID" autocomplete="email" required>
      <div class="button-group">
        <button type="submit" class="btn-login" id="forgotBtn">Send Reset Link</button>
        <a id="backLink" href="/login.html" class="btn btn-link">Back to login</a>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
  <script>App.initForgotPage();</script>
</body>
</html>
